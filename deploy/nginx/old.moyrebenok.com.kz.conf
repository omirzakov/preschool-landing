# Старый Django-проект (online_preschool) на поддомене old.moyrebenok.com.kz
#
# Составлен из текущего рабочего конфига moyrebenok.com.kz: изменён только
# server_name. Сокет gunicorn, пути и поведение сохранены один в один.
#
# Выкладывать этот файл как есть (только HTTP, порт 80), затем выпустить
# сертификат: sudo certbot --nginx -d old.moyrebenok.com.kz
# Certbot сам добавит ssl-директивы и редирект с HTTP на HTTPS.

server {
    listen 80;
    server_name old.moyrebenok.com.kz;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/projects/online_preschool/staticfiles/;
    }

    # Блока /media/ в текущем конфиге нет — медиафайлы отдаёт сам Django
    # (urls.py, ветка DEBUG). Поведение намеренно оставлено прежним.

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
    }
}
