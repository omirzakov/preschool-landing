# Лендинг (статика Vite) на основном домене moyrebenok.com.kz
# Заменяет текущий server-блок старого Django-проекта.
#
# Пути к сертификату взяты из текущего рабочего конфига — он уже выпущен
# на moyrebenok.com.kz и www, новый получать не нужно.
#
# http2 намеренно не включён: в текущем конфиге его нет, а директива
# "http2 on" требует nginx >= 1.25.1 и на более старой версии уронит nginx -t.

server {
    listen 80;
    server_name moyrebenok.com.kz www.moyrebenok.com.kz;

    # Оставляем ACME-проверку рабочей, чтобы certbot мог продлевать сертификат.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://moyrebenok.com.kz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.moyrebenok.com.kz;

    ssl_certificate     /etc/letsencrypt/live/moyrebenok.com.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moyrebenok.com.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://moyrebenok.com.kz$request_uri;
}

server {
    listen 443 ssl;
    server_name moyrebenok.com.kz;

    ssl_certificate     /etc/letsencrypt/live/moyrebenok.com.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moyrebenok.com.kz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/moyrebenok-landing/current;
    index index.html;

    access_log /var/log/nginx/moyrebenok-landing.access.log;
    error_log  /var/log/nginx/moyrebenok-landing.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Файлы в /assets/ содержат хеш в имени — кешируем навсегда.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кешируем, иначе после деплоя пользователи увидят старую версию.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
